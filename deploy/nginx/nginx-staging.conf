# Staging (atpg): plain HTTP on :80 inside the container, published on :8098.
# ArvanCloud terminates HTTPS for staging.torshx.com and calls this origin.
# Started by compose.yml with: nginx -c /etc/nginx/lp/nginx-staging.conf

user nginx;
worker_processes 2;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/lp/http.conf;

    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/lp/snippets/app.conf;

        # Interactive API docs stay on for the frontend developer on staging.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            include /etc/nginx/lp/snippets/proxy_api.conf;
        }
    }
}
