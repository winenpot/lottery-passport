proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr is already the real client (realip from Arvan's ar-real-ip).
# Overwrite, never append, so a client cannot spoof X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $lp_proto;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
proxy_send_timeout 20s;
include /etc/nginx/lp/snippets/security_headers.conf;
# API answers are per user: no cache anywhere (also tells ArvanCloud).
add_header Cache-Control "no-store" always;
