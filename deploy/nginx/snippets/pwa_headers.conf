# The PWA's pages only (not the API, not the admin panel, which has its own
# scripts): camera for the QR scanner, nothing loaded from other origins.
include /etc/nginx/lp/snippets/security_headers.conf;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
