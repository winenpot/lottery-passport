# Everything one site serves: the API, the admin panel and the PWA.
# Included inside a server { } block by both environments.

include /etc/nginx/lp/snippets/security_headers.conf;

client_max_body_size 16k;
error_page 429 = @rate_limited;

location @rate_limited {
    default_type application/json;
    include /etc/nginx/lp/snippets/security_headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 10 always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"rate limit exceeded"}}';
}

location = /api/v1/auth/request {
    limit_req zone=otp_public burst=3 nodelay;
    limit_req zone=otp_lounge burst=40 nodelay;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

location /api/ {
    limit_req zone=api_public burst=40 nodelay;
    limit_req zone=api_lounge burst=600 nodelay;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

location = /health {
    access_log off;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

location = /ready {
    access_log off;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

# Admin panel: open to everyone (2026-10-24, see ADR-0013 and the 2026-10-23
# handoff §6/§4 -- the IP allow-list kept breaking on every new network;
# identity is the real gate now: active-admin-only SMS code, re-checked
# role, and TOTP for any admin who has enrolled). Same rate limit shape as
# the player OTP endpoint: this still sends a real SMS per attempt and now
# also gates a TOTP code, so it needs the same brute-force/SMS-cost ceiling
# nginx already gives /api/v1/auth/request.
location /admin {
    limit_req zone=otp_public burst=3 nodelay;
    limit_req zone=otp_lounge burst=40 nodelay;
    include /etc/nginx/site/admin_allow.conf;
    deny all;
    client_max_body_size 1m;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

# Never served, even if a build accidentally contains them.
location ~ ^/(src|node_modules|Handoff|\.git|\.env) {
    include /etc/nginx/lp/snippets/security_headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

# Terms/privacy page (LG1'): the text lives in the database, edited in
# /admin ("Terms & privacy"), and the API renders it. Not cached (the API's
# no-store), so an admin edit shows at once. The slug is the exact
# TERMS_VERSION; PRIVACY_URL is the same page with #privacy.
location ~ ^/legal/[A-Za-z0-9_-]+$ {
    limit_req zone=api_public burst=40 nodelay;
    limit_req zone=api_lounge burst=600 nodelay;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

# Admin-uploaded images (W10): GET /media/<sha256>.<ext>, immutable and
# content-addressed. The app sets its own long-lived Cache-Control; nginx
# adds no override here, same as /legal above. The regex is quoted because
# of its "{64}": unquoted, nginx reads the brace as the block start and
# `nginx -t` fails.
location ~ "^/media/[0-9a-f]{64}\.(png|jpg|webp)$" {
    limit_req zone=api_public burst=40 nodelay;
    limit_req zone=api_lounge burst=600 nodelay;
    include /etc/nginx/lp/snippets/proxy_api.conf;
}

# The PWA (Arman's dist/): fingerprinted assets cached for a year, everything
# else revalidated. The Cache-Control headers have no "always", so a 404 is
# never cached for a year by ArvanCloud or the browser.
root /srv/web/current;

location /assets/ {
    include /etc/nginx/lp/snippets/pwa_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Client-side routes (/b/<code>, /q/...) fall back to index.html.
location / {
    include /etc/nginx/lp/snippets/pwa_headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
