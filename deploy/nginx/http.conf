# Shared http-level settings, included by nginx-staging.conf and
# nginx-production.conf inside their http { } block.

include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
sendfile on;
keepalive_timeout 30s;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;

# Real client IP: ArvanCloud sends it in `ar-real-ip`. Trusted only from
# Arvan's own ranges, so a direct caller cannot forge it.
include /etc/nginx/lp/snippets/arvan_realip.conf;

# Bottle codes (/b/<code>) and signed venue links (/q/...) are secrets in a
# URL: never write them to the access log.
map $request_uri $loggable_uri {
    ~^/b/   /b/[redacted];
    ~^/q/   /q/[redacted];
    ~^/r/   /r/[redacted];
    default $request_uri;
}
log_format redacted '$remote_addr [$time_iso8601] "$request_method $loggable_uri" '
                    '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';
access_log /var/log/nginx/access.log redacted;

# ArvanCloud talks plain HTTP to staging; the browser used HTTPS. Pass that on
# so the API builds https URLs (admin redirects). Production is https anyway.
map $http_x_forwarded_proto $lp_proto {
    https   https;
    default $scheme;
}

# Lounges put every player behind ONE public IP. Per-IP limits would lock a
# whole lounge out, so lounge IPs (site/lounge_ips.conf, lines like
# "203.0.113.10 1;") get their own, much larger budget.
geo $is_lounge {
    default 0;
    include /etc/nginx/site/lounge_ips.conf;
}
map $is_lounge $public_key {
    0 $binary_remote_addr;
    1 "";
}
map $is_lounge $lounge_key {
    0 "";
    1 $binary_remote_addr;
}
# Requests whose key is empty are not counted by that zone.
limit_req_zone $public_key zone=api_public:20m rate=10r/s;
limit_req_zone $lounge_key zone=api_lounge:1m  rate=300r/s;
limit_req_zone $public_key zone=otp_public:10m rate=6r/m;
limit_req_zone $lounge_key zone=otp_lounge:1m  rate=120r/m;
limit_req_status 429;

upstream api {
    server api:8000;
    keepalive 32;
}
