# Production: TLS at the origin too (ArvanCloud -> server is encrypted; OTP
# codes and session cookies cross that hop). Certificates in <base>/tls
# (acme.sh, DNS-01 via the Arvan API; see docs/OPERATIONS.md#tls-certificates).
# Started by compose.yml with: nginx -c /etc/nginx/lp/nginx-production.conf

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/lp/http.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Unknown host names: no answer at all.
    server {
        listen 80 default_server;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        server_name play.torshx.com torshx.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name play.torshx.com;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        include /etc/nginx/lp/snippets/app.conf;

        # The API's interactive docs are internal in production.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }
    }

    # The bare domain: printed QR codes point at https://torshx.com/b/<code>
    # (and /q/...), so those paths go to the campaign app; everything else to
    # the brand site (www.torshx.com, served elsewhere). 302, not 301: browsers
    # would cache a 301 forever, and the apex may serve the app itself one day.
    server {
        listen 443 ssl;
        http2 on;
        server_name torshx.com;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        include /etc/nginx/lp/snippets/security_headers.conf;

        location ~ ^/(b|q)/ {
            return 302 https://play.torshx.com$request_uri;
        }
        location / {
            return 302 https://www.torshx.com$request_uri;
        }
    }
}
