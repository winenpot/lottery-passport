# Production: TLS at the origin too (ArvanCloud -> server is encrypted; OTP
# codes and session cookies cross that hop). Certificates in <base>/tls
# (acme.sh, DNS-01 via the Arvan API; see docs/OPERATIONS.md#tls-certificates).
# Started by compose.yml with: nginx -c /etc/nginx/lp/nginx-production.conf

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/lp/http.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Unknown host names: no answer at all.
    server {
        listen 80 default_server;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        server_name play.torshx.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name play.torshx.com;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        include /etc/nginx/lp/snippets/app.conf;

        # The API's interactive docs are internal in production.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }
    }
}
