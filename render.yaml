services:
  - type: web
    name: lottery-passport-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: .venv/bin/alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: PORT
        value: 10000
      # Render's proxy peers are in 10.0.0.0/8: trust X-Forwarded-For only from
      # them, so the rate limit and logs see the real client (not the proxy).
      - key: FORWARDED_ALLOW_IPS
        value: 10.0.0.0/8
      - key: REDEMPTION_CODE_PEPPER
        generateValue: true
        sync: false
      - key: KAVENEGAR_OTP_API_KEY
        sync: false
      - key: KAVENEGAR_TEMPLATE_LOGIN
        value: login
      - key: KAVENEGAR_TEMPLATE_SIGNUP
        value: signup
      - key: OTP_TTL_SECONDS
        value: 150
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_SECONDS
        value: 60
      - key: OTP_DAILY_LIMIT_PER_PHONE
        value: 5
      - key: AUTH_SESSION_TTL_SECONDS
        value: 2592000
      - key: SESSION_COOKIE_NAME
        value: lottery_passport_session
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-passport-db
          property: connectionString

# Not used by the live demo: it runs on Supabase through DATABASE_URL (set in the
# dashboard). Kept only so the blueprint stays self-contained.
databases:
  - name: lottery-passport-db
    databaseName: lottery_passport
    user: lottery_passport
    plan: free
    region: oregon