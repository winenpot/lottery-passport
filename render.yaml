services:
  - type: web
    name: lottery-passport-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: .venv/bin/alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: PORT
        value: 10000
      # Render's chain is: client -> Cloudflare edge -> Render proxy (10.x) -> a
      # local proxy (127.0.0.1) -> uvicorn. uvicorn takes the right-most address
      # that is NOT in this list, i.e. the real client; a client-supplied
      # X-Forwarded-For is ignored. Cloudflare ranges: cloudflare.com/ips-v4, -v6.
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1,10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: REDEMPTION_CODE_PEPPER
        generateValue: true
        sync: false
      - key: KAVENEGAR_OTP_API_KEY
        sync: false
      - key: KAVENEGAR_TEMPLATE_LOGIN
        value: login
      - key: KAVENEGAR_TEMPLATE_SIGNUP
        value: signup
      - key: OTP_TTL_SECONDS
        value: 150
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_SECONDS
        value: 60
      - key: OTP_DAILY_LIMIT_PER_PHONE
        value: 5
      - key: AUTH_SESSION_TTL_SECONDS
        value: 2592000
      - key: SESSION_COOKIE_NAME
        value: lottery_passport_session
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-passport-db
          property: connectionString

# Not used by the live demo: it runs on Supabase through DATABASE_URL (set in the
# dashboard). Kept only so the blueprint stays self-contained.
databases:
  - name: lottery-passport-db
    databaseName: lottery_passport
    user: lottery_passport
    plan: free
    region: oregon