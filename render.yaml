services:
  - type: web
    name: lottery-passport-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: .venv/bin/alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: PORT
        value: 10000
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: API_KEY
        generateValue: true
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-passport-db
          property: connectionString

databases:
  - name: lottery-passport-db
    databaseName: lottery_passport
    user: lottery_passport
    plan: free
    region: oregon