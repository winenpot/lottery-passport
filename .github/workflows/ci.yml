name: CI

# quality: every push and PR. image + staging-verify: master pushes only.
# Deploys are pull-based (docs/adr/0011-pull-based-deploys-from-ghcr.md): the
# image job moves the :staging tag, atpg's deploy agent notices within a
# minute, and staging-verify waits until the public /health shows this commit.
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: lottery_passport
          POSTGRES_USER: lottery_passport
          POSTGRES_PASSWORD: lottery_passport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottery_passport -d lottery_passport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lottery_passport:lottery_passport@localhost:5432/lottery_passport
      TEST_DATABASE_URL: postgresql+asyncpg://lottery_passport:lottery_passport@localhost:5432/lottery_passport
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: requirements.txt matches uv.lock (the Docker image installs it)
        run: >-
          uv export --locked --no-default-groups --no-emit-project --no-header
          --format requirements-txt | diff -u requirements.txt -
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app main.py scripts
      - run: uv run pytest
      - name: docker build (PRs; master builds in the image job)
        if: github.event_name == 'pull_request'
        run: docker build --tag lottery-passport-api:ci .

  commit-lint:
    # Enforces the same gitmoji + Conventional Commits subject rule as
    # .githooks/commit-msg, as a CI check rather than only a local git hook
    # -- a hook can be skipped with --no-verify, or simply never installed
    # (core.hooksPath has to be set per clone), so this is the backstop that
    # applies regardless of who or what is committing. Runs the literal
    # hook script against every real subject line so there is exactly one
    # copy of the rule to keep in sync, never a second regex that could
    # drift from it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PUSH_MESSAGE: ${{ github.event.head_commit.message }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check commit subjects
        run: |
          set -euo pipefail
          failed=0
          check() {
            # $1/$2 arrive as real shell values (via env above), never
            # interpolated into this script's text, so an adversarial
            # subject line ("; rm -rf ... #) can't execute as code.
            local subject="$1" label="$2"
            local tmp
            tmp="$(mktemp)"
            printf '%s\n' "$subject" >"$tmp"
            if ! python3 .githooks/commit-msg "$tmp"; then
              echo "::error::${label}: ${subject}"
              failed=1
            fi
            rm -f "$tmp"
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            check "$PR_TITLE" "PR title (becomes the squash-merge subject)"
            while IFS= read -r subject; do
              check "$subject" "commit subject"
            done < <(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
                        --jq '.[].commit.message | split("\n")[0]')
          else
            subject="$(printf '%s\n' "$PUSH_MESSAGE" | head -n1)"
            check "$subject" "push commit subject"
          fi
          exit "$failed"

  gitleaks:
    # Continuous version of the SECURITY.md pre-launch checklist item
    # ("gitleaks detect on full history: clean"), added 2026-10-23 after a
    # one-off manual run. Free for personal/org accounts without
    # GITLEAKS_LICENSE (github.com/gitleaks/gitleaks-action#environment-variables);
    # winenpot is a user account, so no license secret is needed here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # posts a PR comment if gitleaks finds something
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs the full history, not just this commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [quality, gitleaks, commit-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Runs one at a time, in push order, so an older commit never moves
    # :staging after a newer one.
    concurrency:
      group: image-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ env.IMAGE }}:sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Move :staging (only if this is still the newest master commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "master moved on to $head; its own run moves :staging"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:staging" "$IMAGE:sha-$GITHUB_SHA"

  staging-verify:
    needs: image
    # Set the repository variable STAGING_URL (https://staging.torshx.com)
    # once staging answers; until then this job is skipped.
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait until staging serves ${{ github.sha }}
        env:
          URL: ${{ vars.STAGING_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${GITHUB_SHA:0:7}"
          live=""
          for _ in $(seq 1 60); do
            live="$(curl -fsS -m 10 "$URL/health" | jq -r .commit 2>/dev/null || true)"
            if [ "$live" = "$want" ]; then
              echo "staging serves $want"
              exit 0
            fi
            head="$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)"
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "superseded by $head; that run verifies staging"
              exit 0
            fi
            sleep 10
          done
          echo "staging still serves '${live}', not $want (deploy failed or rolled back:"
          echo "on atpg run /home/data/lottery-passport/repo/deploy/deploy.sh --status)"
          exit 1