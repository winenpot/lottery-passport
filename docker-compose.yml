services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: lottery_passport
      POSTGRES_USER: lottery_passport
      POSTGRES_PASSWORD: local_development_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lottery_passport -d lottery_passport" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Lottery Passport API
      ENVIRONMENT: development
      PORT: 8000
      API_KEY: local_development_only
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
      DATABASE_URL: postgresql+asyncpg://lottery_passport:local_development_only@postgres:5432/lottery_passport
      DB_CONNECT_TIMEOUT_SECONDS: 5
      FORWARDED_ALLOW_IPS: 127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
