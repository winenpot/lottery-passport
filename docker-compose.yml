services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: lottery_passport
      POSTGRES_USER: lottery_passport
      POSTGRES_PASSWORD: local_development_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lottery_passport -d lottery_passport" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Lottery Passport API
      ENVIRONMENT: development
      PORT: 8000
      REDEMPTION_CODE_PEPPER: local_development_only_pepper_not_secret_0123456789
      REDEMPTION_DAILY_LIMIT_PER_USER: 20
      CAMPAIGN_TIMEZONE: Asia/Tehran
      AUTH_SESSION_TTL_SECONDS: 2592000
      OTP_TTL_SECONDS: 150
      OTP_MAX_ATTEMPTS: 5
      OTP_RESEND_SECONDS: 60
      OTP_DAILY_LIMIT_PER_PHONE: 5
      SESSION_COOKIE_NAME: lottery_passport_session
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
      DATABASE_URL: postgresql+asyncpg://lottery_passport:local_development_only@postgres:5432/lottery_passport
      DB_CONNECT_TIMEOUT_SECONDS: 5
      FORWARDED_ALLOW_IPS: 127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
