[project]
name = "lottery-passport"
version = "0.1.0"
description = "Backend foundation for a campaign passport platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
	"alembic>=1.16,<2.0",
	"asyncpg>=0.30,<1.0",
	"fastapi>=0.116,<1.0",
	"pydantic-settings>=2.10,<3.0",
	"sqlalchemy[asyncio]>=2.0,<3.0",
	"uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
	"httpx>=0.28,<1.0",
	"mypy>=1.17,<2.0",
	"pytest>=8.4,<9.0",
	"pytest-asyncio>=1.1,<2.0",
	"ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["^alembic/"]
