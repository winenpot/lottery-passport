[project]
name = "lottery-passport"
version = "0.1.0"
description = "Backend foundation for a campaign passport platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
# Production runtime only: this is what requirements.txt / the image installs.
# uvicorn without [standard]: just its fast loop + HTTP parser; no reloader
# (watchfiles), websockets or dotenv CLI in production.
dependencies = [
	"alembic>=1.16,<2.0",
	"asyncpg>=0.30,<1.0",
	# Encrypts the admin TOTP secret at rest (app/infrastructure/crypto.py);
	# the TOTP algorithm itself is stdlib (app/domain/totp.py).
	"cryptography>=43,<46",
	"fastapi>=0.116,<1.0",
	"httptools>=0.6",
	"itsdangerous>=2.2.0",
	"pydantic-settings>=2.10,<3.0",
	"sqladmin>=0.32.0",
	"sqlalchemy[asyncio]>=2.0,<3.0",
	"tzdata>=2026.1",
	"uvicorn>=0.35,<1.0",
	"uvloop>=0.21; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
]

# Local/CI only, never in the image. All are synced by default (see
# [tool.uv] default-groups); pick one with `uv sync --only-group lint`.
[dependency-groups]
lint = [
	"mypy>=1.17,<2.0",
	"ruff>=0.12,<1.0",
	"types-reportlab>=5.0.0.20261008",
]
test = [
	"httpx>=0.28,<1.0",
	"pytest>=8.4,<9.0",
	"pytest-asyncio>=1.1,<2.0",
]
# Printing codes and QR sheets (scripts.qr_sheets), run on an operator's
# machine, not on the server.
codes-print = [
	"reportlab>=5.0.1",
	"segno>=1.6.6",
]
# `uvicorn --reload` for local development.
dev = [
	"watchfiles>=1.0",
]

[tool.uv]
default-groups = ["dev", "lint", "test", "codes-print"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
# frontend/ is a read-only reference clone of the frontend repo (.gitignore).
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["^alembic/"]
