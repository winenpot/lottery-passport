{% extends "sqladmin/layout.html" %}
{# Upload a PNG/JPEG/WebP (max 512 KB), get back a /media/<sha256>.<ext>
   URL to paste into an avatar/badge/prize-art row's image_url field. #}
{% block content %}
<div class="col-12 col-md-6">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Images</h3>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('admin:view-media-upload') }}"
        enctype="multipart/form-data"
        onsubmit="this.querySelector('[type=submit]').disabled = true;">
        <div class="mb-3">
          <label class="form-label" for="file">Image (PNG, JPEG or WebP, up to 512 KB)</label>
          <input id="file" name="file" type="file" accept="image/png,image/jpeg,image/webp"
            class="form-control" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      {% if uploaded_url %}
      <div class="mt-3">
        <label class="form-label" for="uploaded-url">Uploaded. Paste this into image_url:</label>
        <input id="uploaded-url" type="text" class="form-control" readonly
          value="{{ uploaded_url }}" onclick="this.select();">
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
