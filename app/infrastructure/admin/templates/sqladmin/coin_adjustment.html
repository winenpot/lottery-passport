{% extends "sqladmin/layout.html" %}
{# Give or take coins from a player, through CoinAdjustmentService. #}
{% block content %}
<div class="col-12 col-md-6">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Adjust coins</h3>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('admin:view-coin-adjustments') }}"
        onsubmit="this.querySelector('[type=submit]').disabled = true;">
        <div class="mb-3">
          <label class="form-label" for="identifier">Player phone number</label>
          <input id="identifier" name="identifier" type="tel" inputmode="tel"
            class="form-control" placeholder="09xx xxx xxxx" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="amount">Amount (negative to take coins away)</label>
          <input id="amount" name="amount" type="number" step="1" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="note">Reason (required, goes in the audit log)</label>
          <textarea id="note" name="note" class="form-control" rows="2" maxlength="500" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Apply</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
